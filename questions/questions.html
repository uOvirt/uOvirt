<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>uOVirt — Questions</title>
  </head>

  <body>
    <header>
      <strong>uOVirt</strong>
      <a href="home.html">← Back home</a>
    </header>

    <main>
      <p>CONTACT UOVIRT</p>
      <h1>Let's get you <em>unlost.</em></h1>
      <p>Have a question, found an issue, or want to suggest a campus location? Send us a message and we'll get back to you.</p>
      <p>Email us directly: <a href="mailto:contact@uovirt.ca">contact@uovirt.ca</a></p>

      <form action="mailto:contact@uovirt.ca" method="post" enctype="text/plain">
        <p>
          <label>Your name</label><br />
          <input type="text" name="name" placeholder="Jane Doe" />
        </p>

        <p>
          <label>Email address</label><br />
          <input type="email" name="email" placeholder="jane@example.com" />
        </p>

        <p>
          <label>What can we help with?</label><br />
          <textarea name="message" placeholder="Type your question here..."></textarea>
        </p>

        <button type="submit">Send question →</button>
      </form>
    </main>
  </body>
</html>
